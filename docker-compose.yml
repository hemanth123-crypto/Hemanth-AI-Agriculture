version: '3.8'

services:
  agri-advisor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agri_crop_advisor
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - APP_ENV=production
      - LOG_LEVEL=INFO
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - ./data/feedback:/app/data/feedback
      - ./evaluation/reports:/app/evaluation/reports
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
